<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>অ্যাডমিন প্যানেল | বাংলাদেশ মেলা অ্যাপস</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #d4af37; margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
    
    /* ড্রপডাউন স্টাইল */
    .slider-dropdown {
      background: white;
      border-radius: 24px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .slider-header {
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      padding: 15px 22px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s;
    }
    .slider-header:hover {
      background: linear-gradient(115deg, #c49b2a, #b8860b);
    }
    .slider-header h2 {
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-icon {
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      transition: transform 0.3s;
    }
    .slider-header.open .toggle-icon {
      transform: rotate(180deg);
    }
    .slider-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
      background: white;
    }
    .slider-content.open {
      max-height: 2000px;
      transition: max-height 0.5s ease-in;
    }
    .form-card {
      padding: 25px;
    }
    .form-card h3 {
      color: #b8860b;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px 0;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #d4af37;
    }
    .contact-group {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
      position: relative;
    }
    .contact-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .contact-row input { margin: 0; flex: 1; }
    .removeContactBtn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.7rem;
      margin-top: 8px;
    }
    button {
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      margin-right: 10px;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    .delete-btn { background: #dc3545; }
    .edit-btn { background: #28a745; }
    .card-list {
      background: white;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-height: 500px;
      overflow-y: auto;
    }
    .card-list h3 { color: #b8860b; margin-bottom: 20px; }
    .card-item {
      background: #f8f9fa;
      border-left: 4px solid #d4af37;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
    }
    .card-item h4 { color: #2c3e50; margin-bottom: 8px; }
    .card-item p { color: #666; margin: 5px 0; font-size: 0.9rem; }
    .card-actions { margin-top: 12px; }
    .small-btn { padding: 6px 12px; font-size: 0.8rem; margin: 2px; }
    
    @media (max-width: 550px) {
      .slider-header h2 { font-size: 1rem; }
      .form-card { padding: 18px; }
      .slider-header { padding: 12px 18px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🏆 অ্যাডমিন প্যানেল | মেলা স্লাইডার 🏆</h1>

  <!-- লাইনার ১: নতুন পোস্ট যোগ -->
  <div class="slider-dropdown">
    <div class="slider-header" id="sliderHeaderAdd">
      <h2>➕ স্লাইডার - নতুন পোস্ট যোগ</h2>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="slider-content" id="sliderContentAdd">
      <div class="form-card">
        <h3>✨ মেলার তথ্য যোগ করুন ✨</h3>
        <input type="text" id="title" placeholder="মেলার নাম *" required>
        <textarea id="description" rows="3" placeholder="বিবরণ *" required></textarea>
        <input type="text" id="address" placeholder="ঠিকানা/লোকেশন">
        <input type="url" id="mapLink" placeholder="গুগল ম্যাপ লিংক (ঐচ্ছিক)">
        
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <input type="datetime-local" id="startDate" style="flex:1;" required>
          <input type="datetime-local" id="endDate" style="flex:1;" required>
        </div>

        <select id="melaType">
          <option value="মাসব্যাপী মেলা">মাসব্যাপী মেলা</option>
          <option value="১৫ দিনব্যাপী মেলা">১৫ দিনব্যাপী মেলা</option>
          <option value="৭ দিনব্যাপী মেলা">৭ দিনব্যাপী মেলা</option>
          <option value="৩ দিনব্যাপী মেলা">৩ দিনব্যাপী মেলা</option>
        </select>

        <input type="number" id="order" placeholder="ক্রম (১,২,৩...)" value="1">

        <div id="contactsArea">
          <h4 style="margin:15px 0 10px;">📞 যোগাযোগ ব্যক্তি (একাধিক)</h4>
          <div id="contactList">
            <div class="contact-group">
              <div class="contact-row">
                <input type="text" placeholder="নাম" class="contact-name">
                <input type="tel" placeholder="মোবাইল নাম্বার" class="contact-phone">
              </div>
            </div>
          </div>
          <button type="button" id="addContactBtn" style="background:#6c757d;">+ আরও যোগাযোগ যোগ করুন</button>
        </div>

        <div style="margin-top: 20px;">
          <button id="saveBtn">➕ সংরক্ষণ করুন</button>
          <button id="cancelBtn" style="background:#6c757d; display:none;">বাতিল করুন</button>
        </div>
      </div>
    </div>
  </div>

  <!-- লাইনার ২: পোস্ট করা তথ্য এডিট -->
  <div class="slider-dropdown">
    <div class="slider-header" id="sliderHeaderEdit">
      <h2>✏️ স্লাইডার পোস্ট করা তথ্য এডিট</h2>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="slider-content" id="sliderContentEdit">
      <div class="card-list">
        <div id="postsList">লোড হচ্ছে...</div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAKRgsUrYL4uAWinn5dcJrKck1nqUokRdw",
    authDomain: "all-hadith-a68fa.firebaseapp.com",
    projectId: "all-hadith-a68fa",
    databaseURL: "https://all-hadith-a68fa-default-rtdb.firebaseio.com/",
    storageBucket: "all-hadith-a68fa.firebasestorage.app",
    messagingSenderId: "124928027736",
    appId: "1:124928027736:android:f4d9a9a9ed667150ca2e2d"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const melaPostsRef = database.ref('melaPosts');

  let currentEditId = null;

  // ড্রপডাউন টগল ফাংশন
  function toggleDropdown(headerId, contentId) {
    const header = document.getElementById(headerId);
    const content = document.getElementById(contentId);
    header.classList.toggle('open');
    content.classList.toggle('open');
  }

  // লাইনার ১ টগল
  document.getElementById('sliderHeaderAdd').addEventListener('click', () => {
    toggleDropdown('sliderHeaderAdd', 'sliderContentAdd');
  });

  // লাইনার ২ টগল
  document.getElementById('sliderHeaderEdit').addEventListener('click', () => {
    toggleDropdown('sliderHeaderEdit', 'sliderContentEdit');
  });

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function calculateDays(startDate, endDate, melaType) {
    if (startDate && endDate) {
      const start = new Date(startDate);
      const end = new Date(endDate);
      const diffTime = Math.abs(end - start);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diffDays;
    }
    switch(melaType) {
      case 'মাসব্যাপী মেলা': return 30;
      case '১৫ দিনব্যাপী মেলা': return 15;
      case '৭ দিনব্যাপী মেলা': return 7;
      case '৩ দিনব্যাপী মেলা': return 3;
      default: return 0;
    }
  }

  function collectContacts() {
    const contacts = [];
    document.querySelectorAll('.contact-group').forEach(group => {
      const name = group.querySelector('.contact-name').value.trim();
      const phone = group.querySelector('.contact-phone').value.trim();
      if (name && phone) contacts.push({ name, phone });
    });
    return contacts;
  }

  function renderContactFields(contacts) {
    const container = document.getElementById('contactList');
    container.innerHTML = '';
    if (!contacts || contacts.length === 0) {
      const div = document.createElement('div');
      div.className = 'contact-group';
      div.innerHTML = `<div class="contact-row"><input type="text" placeholder="নাম" class="contact-name"><input type="tel" placeholder="মোবাইল নাম্বার" class="contact-phone"></div>`;
      container.appendChild(div);
    } else {
      contacts.forEach(contact => {
        const div = document.createElement('div');
        div.className = 'contact-group';
        div.innerHTML = `<div class="contact-row"><input type="text" placeholder="নাম" class="contact-name" value="${escapeHtml(contact.name)}"><input type="tel" placeholder="মোবাইল নাম্বার" class="contact-phone" value="${escapeHtml(contact.phone)}"></div><button type="button" class="removeContactBtn" style="background:#dc3545; padding:4px 8px; font-size:0.7rem;">✖️ সরান</button>`;
        container.appendChild(div);
        div.querySelector('.removeContactBtn').addEventListener('click', () => div.remove());
      });
    }
  }

  function loadPosts() {
    melaPostsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('postsList');
      if (!data) {
        container.innerHTML = '<div style="text-align:center;padding:40px;">🎪 কোনো পোস্ট নেই। প্রথম লাইনার দিয়ে পোস্ট যোগ করুন।</div>';
        return;
      }
      const posts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      posts.sort((a,b) => (a.order||0) - (b.order||0));

      let html = '';
      posts.forEach(post => {
        const days = calculateDays(post.startDate, post.endDate, post.melaType);
        html += `
          <div class="card-item" data-id="${post.id}">
            <h4>${escapeHtml(post.title)}</h4>
            <p><strong>📅 ধরন:</strong> ${escapeHtml(post.melaType)} (${days} দিন)</p>
            <p><strong>⏰ সময়:</strong> ${formatDate(post.startDate)} - ${formatDate(post.endDate)}</p>
            <p><strong>📍 ঠিকানা:</strong> ${escapeHtml(post.address) || 'নেই'}</p>
            <p><strong>📝 বিবরণ:</strong> ${escapeHtml(post.description.substring(0,80))}...</p>
            <div class="card-actions">
              <button class="edit-btn small-btn" data-id="${post.id}">✏️ এডিট</button>
              <button class="delete-btn small-btn" data-id="${post.id}">🗑️ ডিলিট</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;

      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => editPost(btn.getAttribute('data-id')));
      });
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if(confirm('পোস্টটি ডিলিট করবেন?')) {
            await melaPostsRef.child(btn.getAttribute('data-id')).remove();
            alert('পোস্ট ডিলিট হয়েছে!');
          }
        });
      });
    });
  }

  function formatDate(dateStr) {
    if(!dateStr) return 'N/A';
    return new Date(dateStr).toLocaleDateString('bn-BD');
  }

  async function editPost(id) {
    const snapshot = await melaPostsRef.child(id).once('value');
    const post = snapshot.val();
    if(post) {
      document.getElementById('title').value = post.title || '';
      document.getElementById('description').value = post.description || '';
      document.getElementById('address').value = post.address || '';
      document.getElementById('mapLink').value = post.mapLink || '';
      document.getElementById('startDate').value = post.startDate || '';
      document.getElementById('endDate').value = post.endDate || '';
      document.getElementById('melaType').value = post.melaType || 'মাসব্যাপী মেলা';
      document.getElementById('order').value = post.order || 1;
      renderContactFields(post.contacts || []);
      currentEditId = id;
      document.getElementById('saveBtn').innerHTML = '✏️ আপডেট করুন';
      document.getElementById('cancelBtn').style.display = 'inline-block';
      
      // এডিট করার সময় প্রথম লাইনার ড্রপডাউন খুলে দিন
      const headerAdd = document.getElementById('sliderHeaderAdd');
      const contentAdd = document.getElementById('sliderContentAdd');
      if (!contentAdd.classList.contains('open')) {
        headerAdd.classList.add('open');
        contentAdd.classList.add('open');
      }
      // স্ক্রল করে ফর্মে নিয়ে যান
      document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
    }
  }

  function resetForm() {
    document.getElementById('title').value = '';
    document.getElementById('description').value = '';
    document.getElementById('address').value = '';
    document.getElementById('mapLink').value = '';
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    document.getElementById('melaType').value = 'মাসব্যাপী মেলা';
    document.getElementById('order').value = '1';
    renderContactFields([]);
    currentEditId = null;
    document.getElementById('saveBtn').innerHTML = '➕ সংরক্ষণ করুন';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const description = document.getElementById('description').value.trim();
    if(!title || !description) {
      alert('শিরোনাম ও বিবরণ দিতে হবে');
      return;
    }
    const contacts = collectContacts();
    const days = calculateDays(document.getElementById('startDate').value, document.getElementById('endDate').value, document.getElementById('melaType').value);
    
    const postData = {
      title, description,
      address: document.getElementById('address').value,
      mapLink: document.getElementById('mapLink').value,
      startDate: document.getElementById('startDate').value,
      endDate: document.getElementById('endDate').value,
      melaType: document.getElementById('melaType').value,
      order: parseInt(document.getElementById('order').value) || 1,
      contacts: contacts,
      days: days,
      updatedAt: Date.now()
    };

    try {
      if(currentEditId) {
        await melaPostsRef.child(currentEditId).update(postData);
        alert('পোস্ট আপডেট হয়েছে!');
        resetForm();
      } else {
        await melaPostsRef.push().set(postData);
        alert('নতুন মেলা যোগ হয়েছে!');
        resetForm();
      }
    } catch(e) { alert('ত্রুটি: '+e.message); }
  });

  document.getElementById('cancelBtn').addEventListener('click', resetForm);
  document.getElementById('addContactBtn').addEventListener('click', () => {
    const container = document.getElementById('contactList');
    const div = document.createElement('div');
    div.className = 'contact-group';
    div.innerHTML = `<div class="contact-row"><input type="text" placeholder="নাম" class="contact-name"><input type="tel" placeholder="মোবাইল নাম্বার" class="contact-phone"></div><button type="button" class="removeContactBtn" style="background:#dc3545; padding:4px 8px; font-size:0.7rem;">✖️ সরান</button>`;
    container.appendChild(div);
    div.querySelector('.removeContactBtn').addEventListener('click', () => div.remove());
  });

  loadPosts();
</script>
</body>
</html>
