<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>বাংলাদেশ মেলা অ্যাপস | গোল্ডেন স্লাইডার</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #e8e8e8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', 'Noto Sans Bengali', system-ui, sans-serif;
      padding: 16px;
    }

    .billboard {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15), 0 0 0 2px rgba(212, 175, 55, 0.3);
      position: relative;
      border-radius: 24px;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
      z-index: 10;
    }

    .news-card {
      background: #ffffff;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .tag {
      display: inline-block;
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      padding: 6px 20px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .title {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #b8860b, #d4af37, #ffd700);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 18px;
      line-height: 1.3;
      padding: 0 15px;
    }

    .desc {
      font-size: 1rem;
      color: #6b6b6b;
      line-height: 1.5;
      padding: 0 20px;
      max-width: 90%;
      font-weight: 500;
    }

    .slide-indicators {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 20;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.3s;
      cursor: pointer;
    }

    .indicator.active {
      width: 20px;
      border-radius: 10px;
      background: #d4af37;
    }

    @media (max-width: 550px) {
      .title { font-size: 1.2rem; padding: 0 10px; margin-bottom: 12px; }
      .desc { font-size: 0.85rem; padding: 0 15px; }
      .tag { font-size: 0.65rem; padding: 4px 16px; margin-bottom: 15px; }
    }

    @media (max-width: 400px) {
      .title { font-size: 1rem; }
      .desc { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
<div class="billboard">
  <div class="screen">
    <div class="content-container" id="slidesContainer">
      <div class="slide active">
        <div class="news-card">
          <div class="tag">🎪 লোড হচ্ছে...</div>
          <div class="title">বাংলাদেশ মেলা অ্যাপস</div>
          <div class="desc">মেলার তথ্য আসছে...</div>
        </div>
      </div>
    </div>
    <div class="slide-indicators" id="indicators"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  // Firebase কনফিগারেশন
  const firebaseConfig = {
    apiKey: "AIzaSyAKRgsUrYL4uAWinn5dcJrKck1nqUokRdw",
    authDomain: "all-hadith-a68fa.firebaseapp.com",
    projectId: "all-hadith-a68fa",
    databaseURL: "https://all-hadith-a68fa-default-rtdb.firebaseio.com/", // Realtime DB URL
    storageBucket: "all-hadith-a68fa.firebasestorage.app",
    messagingSenderId: "124928027736",
    appId: "1:124928027736:android:f4d9a9a9ed667150ca2e2d"
  };

  // Firebase initialize
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let slides = [];
  let currentIndex = 0;
  let interval;

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function createSlideHTML(card, index) {
    return `
      <div class="slide" data-index="${index}">
        <div class="news-card">
          <div class="tag">${escapeHtml(card.tag) || '🎪 মেলা'} | ${escapeHtml(card.melaType) || 'মেলা'}</div>
          <div class="title">${escapeHtml(card.title)}</div>
          <div class="desc">${escapeHtml(card.description)}</div>
        </div>
      </div>
    `;
  }

  function renderSlides() {
    const container = document.getElementById('slidesContainer');
    const indicatorsDiv = document.getElementById('indicators');
    
    if (!slides || slides.length === 0) {
      container.innerHTML = `
        <div class="slide active">
          <div class="news-card">
            <div class="tag">🎪 স্বাগতম</div>
            <div class="title">বাংলাদেশ মেলা অ্যাপস</div>
            <div class="desc">অ্যাডমিন প্যানেল থেকে মেলার তথ্য যোগ করুন।</div>
          </div>
        </div>
      `;
      indicatorsDiv.innerHTML = '<div class="indicator active"></div>';
      return;
    }

    // স্লাইড তৈরি
    let slidesHtml = '';
    slides.forEach((slide, idx) => {
      slidesHtml += createSlideHTML(slide, idx);
    });
    container.innerHTML = slidesHtml;

    // ইন্ডিকেটর তৈরি
    let indicatorsHtml = '';
    for (let i = 0; i < slides.length; i++) {
      indicatorsHtml += `<div class="indicator ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`;
    }
    indicatorsDiv.innerHTML = indicatorsHtml;

    // ইন্ডিকেটরে ক্লিক ইভেন্ট
    document.querySelectorAll('.indicator').forEach(ind => {
      ind.addEventListener('click', (e) => {
        const index = parseInt(e.target.getAttribute('data-index'));
        if (!isNaN(index)) {
          goToSlide(index);
        }
      });
    });

    currentIndex = 0;
    showSlide(0);
    startSlideshow();
  }

  function showSlide(index) {
    const allSlides = document.querySelectorAll('.slide');
    const indicators = document.querySelectorAll('.indicator');
    
    if (allSlides.length === 0) return;
    
    allSlides.forEach(slide => slide.classList.remove('active'));
    indicators.forEach(ind => ind.classList.remove('active'));
    
    if (allSlides[index]) {
      allSlides[index].classList.add('active');
    }
    if (indicators[index]) {
      indicators[index].classList.add('active');
    }
  }

  function goToSlide(index) {
    if (slides.length === 0) return;
    currentIndex = index;
    showSlide(currentIndex);
    
    // টাইমার রিস্টার্ট
    startSlideshow();
  }

  function nextSlide() {
    if (slides.length === 0) return;
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
  }

  function startSlideshow() {
    if (interval) clearInterval(interval);
    if (slides.length > 1) {
      interval = setInterval(nextSlide, 4000);
    }
  }

  // Realtime Database থেকে ডাটা লোড (রিয়েলটাইম আপডেট)
  const melaPostsRef = database.ref('melaPosts');
  
  melaPostsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // অবজেক্ট থেকে array তে কনভার্ট
      const postsArray = Object.keys(data).map(key => ({
        id: key,
        ...data[key]
      }));
      // অর্ডার অনুযায়ী সাজানো (order ফিল্ড থাকলে, না থাকলে যেমন আছে)
      postsArray.sort((a, b) => (a.order || 0) - (b.order || 0));
      slides = postsArray;
    } else {
      slides = [];
    }
    renderSlides();
  });

  // initial load
  renderSlides();
</script>
</body>
</html>
