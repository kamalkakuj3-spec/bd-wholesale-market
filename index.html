<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>বাংলাদেশ মেলা অ্যাপস | গোল্ডেন স্লাইডার</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #e8e8e8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', 'Noto Sans Bengali', system-ui, sans-serif;
      padding: 16px;
    }

    /* বিলবোর্ড - সাদা ও গোল্ডেন আভা */
    .billboard {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15), 0 0 0 2px rgba(212, 175, 55, 0.3);
      position: relative;
      border-radius: 24px;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      overflow-y: auto;
      padding: 20px;
    }

    .slide.active {
      opacity: 1;
      z-index: 10;
    }

    /* কার্ড ডিজাইন */
    .news-card {
      background: #ffffff;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      position: relative;
    }

    /* হেডার সেকশন - ট্যাগ ও স্ট্যাটাস */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .status-badge.running {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status-badge.upcoming {
      background: #fff3e0;
      color: #ed6c02;
    }

    .status-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-icon.running { background: #4caf50; box-shadow: 0 0 5px #4caf50; }
    .status-icon.upcoming { background: #ff9800; }

    .mela-type-badge {
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      padding: 5px 12px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: bold;
      color: white;
    }

    .title {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #b8860b, #d4af37, #ffd700);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .desc {
      font-size: 0.85rem;
      color: #6b6b6b;
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .date-info {
      font-size: 0.7rem;
      color: #999;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .address {
      font-size: 0.75rem;
      color: #b8860b;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .contact-dropdown {
      margin-bottom: 12px;
    }

    .contact-summary {
      background: #f5f5f5;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.75rem;
      color: #b8860b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .contact-list {
      display: none;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px;
      margin-top: 5px;
    }

    .contact-list.show {
      display: block;
    }

    .contact-item {
      padding: 5px 0;
      font-size: 0.7rem;
      border-bottom: 1px solid #eee;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f0f0f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #b8860b;
      text-decoration: none;
      margin-bottom: 10px;
      width: fit-content;
    }

    .view-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 15;
    }

    /* স্লাইড ইন্ডিকেটর */
    .slide-indicators {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 20;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.3s;
      cursor: pointer;
    }

    .indicator.active {
      width: 20px;
      border-radius: 10px;
      background: #d4af37;
    }

    /* মোডাল স্টাইল */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 500px;
      max-height: 80%;
      border-radius: 24px;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: bold;
      background: linear-gradient(135deg, #b8860b, #d4af37);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 15px;
    }

    @media (max-width: 550px) {
      .title { font-size: 1.1rem; }
      .desc { font-size: 0.75rem; }
      .slide { padding: 15px; }
    }
  </style>
</head>
<body>
<div class="billboard">
  <div class="screen">
    <div class="content-container" id="slidesContainer">
      <div class="slide active">
        <div class="news-card">
          <div style="text-align:center; padding:40px;">🎪 লোড হচ্ছে...</div>
        </div>
      </div>
    </div>
    <div class="slide-indicators" id="indicators"></div>
  </div>
</div>

<!-- মোডাল -->
<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  // Firebase কনফিগারেশন
  const firebaseConfig = {
    apiKey: "AIzaSyAKRgsUrYL4uAWinn5dcJrKck1nqUokRdw",
    authDomain: "all-hadith-a68fa.firebaseapp.com",
    projectId: "all-hadith-a68fa",
    databaseURL: "https://all-hadith-a68fa-default-rtdb.firebaseio.com/",
    storageBucket: "all-hadith-a68fa.firebasestorage.app",
    messagingSenderId: "124928027736",
    appId: "1:124928027736:android:f4d9a9a9ed667150ca2e2d"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let slides = [];
  let currentIndex = 0;
  let interval;

  // ইউটিলিটি ফাংশন
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // চালমান/আসন্ন চেক
  function getStatus(startDate, endDate) {
    const now = new Date();
    const start = new Date(startDate);
    const end = new Date(endDate);
    if (now >= start && now <= end) return 'running';
    return 'upcoming';
  }

  // কন্টাক্ট লিস্ট HTML
  function renderContacts(contacts) {
    if (!contacts || contacts.length === 0) return '<div>কোনো যোগাযোগ তথ্য নেই</div>';
    let html = '<div class="contact-summary">📞 যোগাযোগ করুন ▼</div><div class="contact-list">';
    contacts.forEach(c => {
      html += `<div class="contact-item">👤 ${escapeHtml(c.name)}: ${escapeHtml(c.phone)}</div>`;
    });
    html += '</div>';
    return html;
  }

  // মোডাল দেখানো
  function showModal(card) {
    const modal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');
    const status = getStatus(card.startDate, card.endDate);
    const statusText = status === 'running' ? 'চলমান 🟢' : 'আসন্ন 🟠';
    
    let contactsHtml = '<div><strong>📞 যোগাযোগ করুন:</strong></div>';
    if (card.contacts && card.contacts.length > 0) {
      card.contacts.forEach(c => {
        contactsHtml += `<div>👤 ${escapeHtml(c.name)}: <a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a></div>`;
      });
    } else {
      contactsHtml += '<div>কোনো যোগাযোগ তথ্য নেই</div>';
    }

    modalBody.innerHTML = `
      <div class="modal-title">${escapeHtml(card.title)}</div>
      <div class="status-badge ${status === 'running' ? 'running' : 'upcoming'}" style="margin-bottom:10px;">
        <span class="status-icon ${status === 'running' ? 'running' : 'upcoming'}"></span>
        ${statusText}
      </div>
      <div><strong>📅 মেলার ধরন:</strong> ${escapeHtml(card.melaType)} (${card.days || ''} দিনব্যাপী)</div>
      <div><strong>⏰ সময়কাল:</strong> ${formatDate(card.startDate)} - ${formatDate(card.endDate)}</div>
      <div><strong>📍 ঠিকানা:</strong> ${escapeHtml(card.address || 'ঠিকানা নেই')}</div>
      <div style="margin:10px 0;"><strong>📝 বিবরণ:</strong><br>${escapeHtml(card.description)}</div>
      ${contactsHtml}
      ${card.mapLink ? `<div style="margin-top:10px;"><strong>🗺️ অবস্থান:</strong> <a href="${escapeHtml(card.mapLink)}" target="_blank">গুগল ম্যাপে দেখুন</a></div>` : ''}
    `;
    modal.style.display = 'flex';
  }

  function formatDate(dateStr) {
    if (!dateStr) return 'N/A';
    const d = new Date(dateStr);
    return d.toLocaleDateString('bn-BD');
  }

  // স্লাইড তৈরি
  function createSlideHTML(card, idx) {
    const status = getStatus(card.startDate, card.endDate);
    const isRunning = status === 'running';
    const statusText = isRunning ? 'চলমান' : 'আসন্ন';
    const contactHtml = renderContacts(card.contacts || []);
    
    return `
      <div class="slide" data-id="${card.id}" data-index="${idx}">
        <div class="news-card">
          <div class="card-header">
            <div class="status-badge ${isRunning ? 'running' : 'upcoming'}">
              <span class="status-icon ${isRunning ? 'running' : 'upcoming'}"></span>
              ${statusText}
            </div>
            <div class="mela-type-badge">${escapeHtml(card.melaType)} (${card.days || ''} দিন)</div>
          </div>
          <div class="title">${escapeHtml(card.title)}</div>
          <div class="desc">${escapeHtml(card.description).substring(0, 100)}...</div>
          <div class="date-info">
            <span>📅 শুরু: ${formatDate(card.startDate)}</span>
            <span>🏁 শেষ: ${formatDate(card.endDate)}</span>
          </div>
          ${card.address ? `<div class="address">📍 ${escapeHtml(card.address)}</div>` : ''}
          <div class="contact-dropdown" onclick="event.stopPropagation(); toggleContact(this)">
            ${contactHtml}
          </div>
          ${card.mapLink ? `<a href="${escapeHtml(card.mapLink)}" target="_blank" class="map-link" onclick="event.stopPropagation();">🗺️ গুগল ম্যাপ</a>` : ''}
          <button class="view-btn" onclick="event.stopPropagation(); showModalById('${card.id}')">👁️ View</button>
        </div>
      </div>
    `;
  }

  // টগল কন্টাক্ট লিস্ট
  window.toggleContact = function(element) {
    const contactList = element.querySelector('.contact-list');
    if (contactList) {
      contactList.classList.toggle('show');
    }
  }

  // আইডি দিয়ে মোডাল দেখানো
  window.showModalById = function(id) {
    const card = slides.find(s => s.id === id);
    if (card) showModal(card);
  }

  function renderSlides() {
    const container = document.getElementById('slidesContainer');
    const indicatorsDiv = document.getElementById('indicators');
    
    if (!slides || slides.length === 0) {
      container.innerHTML = `<div class="slide active"><div class="news-card"><div style="text-align:center; padding:40px;">🎪 কোনো মেলার তথ্য নেই<br>অ্যাডমিন প্যানেল থেকে যোগ করুন</div></div></div>`;
      indicatorsDiv.innerHTML = '<div class="indicator active"></div>';
      return;
    }

    let slidesHtml = '';
    slides.forEach((slide, idx) => {
      slidesHtml += createSlideHTML(slide, idx);
    });
    container.innerHTML = slidesHtml;

    let indicatorsHtml = '';
    for (let i = 0; i < slides.length; i++) {
      indicatorsHtml += `<div class="indicator ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`;
    }
    indicatorsDiv.innerHTML = indicatorsHtml;

    document.querySelectorAll('.indicator').forEach(ind => {
      ind.addEventListener('click', (e) => {
        const index = parseInt(e.target.getAttribute('data-index'));
        if (!isNaN(index)) goToSlide(index);
      });
    });

    currentIndex = 0;
    showSlide(0);
    startSlideshow();
  }

  function showSlide(index) {
    const allSlides = document.querySelectorAll('.slide');
    const indicators = document.querySelectorAll('.indicator');
    allSlides.forEach(s => s.classList.remove('active'));
    indicators.forEach(i => i.classList.remove('active'));
    if (allSlides[index]) allSlides[index].classList.add('active');
    if (indicators[index]) indicators[index].classList.add('active');
  }

  function goToSlide(index) {
    if (slides.length === 0) return;
    currentIndex = index;
    showSlide(currentIndex);
    startSlideshow();
  }

  function nextSlide() {
    if (slides.length === 0) return;
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
  }

  function startSlideshow() {
    if (interval) clearInterval(interval);
    if (slides.length > 1) interval = setInterval(nextSlide, 5000);
  }

  // Realtime Database লোড
  const melaPostsRef = database.ref('melaPosts');
  melaPostsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      slides = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      slides.sort((a, b) => (a.order || 0) - (b.order || 0));
    } else {
      slides = [];
    }
    renderSlides();
  });

  // মোডাল ক্লোজ
  document.querySelector('.close-modal').onclick = () => {
    document.getElementById('detailModal').style.display = 'none';
  };
  window.onclick = (e) => {
    if (e.target === document.getElementById('detailModal')) {
      document.getElementById('detailModal').style.display = 'none';
    }
  };
</script>
</body>
</html>
