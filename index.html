<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>বাংলাদেশ মেলা অ্যাপস</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Noto Sans Bengali', system-ui, sans-serif;
      padding: 20px;
    }
    .slider-container {
      width: 100%;
      max-width: 900px;
      background: rgba(255,255,255,0.95);
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .slider {
      position: relative;
      height: 400px;
      overflow: hidden;
      border-radius: 20px;
    }
    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffffff, #f8f9fa);
      padding: 40px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.5s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .slide.active { opacity: 1; }
    .tag {
      display: inline-block;
      background: #ff6b6b;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 20px;
      width: fit-content;
    }
    .title {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    .description {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 15px;
    }
    .mela-type {
      color: #ff6b6b;
      font-weight: bold;
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 50%;
      font-size: 1.2rem;
      z-index: 10;
    }
    .prev { left: 10px; }
    .next { right: 10px; }
    .dots {
      text-align: center;
      margin-top: 20px;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #bbb;
      margin: 0 5px;
      cursor: pointer;
    }
    .dot.active { background: #ff6b6b; }
    @media (max-width: 768px) {
      .slider { height: 350px; }
      .title { font-size: 1.5rem; }
      .description { font-size: 0.9rem; }
      .slide { padding: 20px; }
    }
  </style>
</head>
<body>
<div class="slider-container">
  <div class="slider" id="slider">
    <!-- স্লাইডগুলো এখানে ডায়নামিক হবে -->
  </div>
  <div class="dots" id="dots"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAKRgsUrYL4uAWinn5dcJrKck1nqUokRdw",
    authDomain: "all-hadith-a68fa.firebaseapp.com",
    projectId: "all-hadith-a68fa",
    storageBucket: "all-hadith-a68fa.firebasestorage.app",
    messagingSenderId: "124928027736",
    appId: "1:124928027736:android:f4d9a9a9ed667150ca2e2d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentSlide = 0;
  let slides = [];

  // রিয়েলটাইম লিসেনার
  onSnapshot(collection(db, "melaPosts"), (snapshot) => {
    slides = [];
    snapshot.forEach(doc => {
      slides.push({ id: doc.id, ...doc.data() });
    });
    renderSlides();
  });

  function renderSlides() {
    const sliderDiv = document.getElementById('slider');
    const dotsDiv = document.getElementById('dots');
    
    if (slides.length === 0) {
      sliderDiv.innerHTML = '<div class="slide active"><div class="tag">🎪 স্বাগতম</div><div class="title">বাংলাদেশ মেলা অ্যাপস</div><div class="description">অ্যাডমিন প্যানেল থেকে মেলার তথ্য যোগ করুন। স্লাইডার এখানে দেখাবে।</div></div>';
      dotsDiv.innerHTML = '';
      return;
    }

    // স্লাইড তৈরি
    sliderDiv.innerHTML = slides.map((slide, index) => `
      <div class="slide ${index === 0 ? 'active' : ''}">
        <div class="tag">${slide.tag || '🎪 মেলা'} | ${slide.melaType || 'মেলা'}</div>
        <div class="title">${slide.title || 'শিরোনাম নেই'}</div>
        <div class="description">${slide.description || 'বিবরণ নেই'}</div>
        <div class="mela-type">📅 ${slide.melaType || 'মেলার ধরন'}</div>
      </div>
    `).join('');

    // ডটস তৈরি
    dotsDiv.innerHTML = slides.map((_, index) => `
      <div class="dot ${index === 0 ? 'active' : ''}" data-index="${index}"></div>
    `).join('');

    // ডটস এ ইভেন্ট
    document.querySelectorAll('.dot').forEach(dot => {
      dot.addEventListener('click', (e) => {
        const index = parseInt(e.target.dataset.index);
        goToSlide(index);
      });
    });

    currentSlide = 0;
  }

  function goToSlide(index) {
    const slidesElements = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    
    slidesElements[currentSlide].classList.remove('active');
    dots[currentSlide].classList.remove('active');
    
    currentSlide = index;
    
    slidesElements[currentSlide].classList.add('active');
    dots[currentSlide].classList.add('active');
  }

  // নেভিগেশন বাটন যোগ করুন (ঐচ্ছিক)
  const prevBtn = document.createElement('button');
  prevBtn.innerHTML = '❮';
  prevBtn.className = 'nav-btn prev';
  prevBtn.onclick = () => {
    if (slides.length === 0) return;
    goToSlide((currentSlide - 1 + slides.length) % slides.length);
  };
  
  const nextBtn = document.createElement('button');
  nextBtn.innerHTML = '❯';
  nextBtn.className = 'nav-btn next';
  nextBtn.onclick = () => {
    if (slides.length === 0) return;
    goToSlide((currentSlide + 1) % slides.length);
  };
  
  document.querySelector('.slider').appendChild(prevBtn);
  document.querySelector('.slider').appendChild(nextBtn);
</script>
</body>
</html>
