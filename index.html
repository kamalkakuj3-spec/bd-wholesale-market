<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>বাংলাদেশ মেলা অ্যাপস | গোল্ডেন স্লাইডার</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #e8e8e8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', 'Noto Sans Bengali', system-ui, sans-serif;
      padding: 16px;
    }

    .billboard {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15), 0 0 0 2px rgba(212, 175, 55, 0.3);
      position: relative;
      border-radius: 24px;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      overflow-y: auto;
      padding: 20px;
    }

    .slide.active {
      opacity: 1;
      z-index: 10;
    }

    /* পুরো কার্ড ক্লিকযোগ্য */
    .news-card {
      background: #ffffff;
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-radius: 20px;
      position: relative;
      padding-bottom: 50px;
      cursor: pointer;
    }

    /* স্ট্যাটাস ও টাইপ - গ্যাপ কমানো হয়েছে (৪ ভাগের ১ ভাগ) */
    .status-type-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: transparent;
      padding: 2px 20px;  /* আগে ছিল 8px, এখন 2px (৪ ভাগের ১ ভাগ) */
      border-radius: 50px;
      margin-top: 2px;     /* আগে ছিল 8px, এখন 2px */
      margin-bottom: 4px;  /* আগে ছিল 15px, এখন 4px */
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .status-badge.running {
      color: #4caf50;
    }

    .status-badge.upcoming {
      color: #ff9800;
    }

    .blinking-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4caf50;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .static-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff9800;
    }

    .separator {
      color: #b8860b;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .mela-type-text {
      font-size: 0.95rem;
      font-weight: bold;
      color: #b8860b;
      background: transparent;
    }

    /* মেলার নাম */
    .title {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #b8860b, #d4af37, #ffd700);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-top: 20px;
      margin-bottom: 10px;
      line-height: 1.3;
      text-align: center;
      padding: 0 15px;
    }

    /* বিবরণ */
    .desc {
      font-size: 1rem;
      color: #6b6b6b;
      line-height: 1.6;
      margin-bottom: 15px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-align: center;
      padding: 0 15px;
    }

    /* View টেক্সট */
    .view-text {
      position: absolute;
      bottom: 12px;
      right: 15px;
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      color: white;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 15;
      transition: opacity 0.2s;
      pointer-events: auto;
    }

    .view-text:hover {
      opacity: 0.9;
    }

    .slide-indicators {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 20;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.3s;
      cursor: pointer;
    }

    .indicator.active {
      width: 20px;
      border-radius: 10px;
      background: #d4af37;
    }

    /* মোডাল স্টাইল */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 500px;
      max-height: 80%;
      border-radius: 24px;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: bold;
      background: linear-gradient(135deg, #b8860b, #d4af37);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 15px;
      text-align: center;
    }

    .modal-section {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .contact-item {
      padding: 6px 0;
      font-size: 0.85rem;
    }

    .contact-item a {
      color: #b8860b;
      text-decoration: none;
    }

    .map-link-btn {
      display: inline-block;
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      color: white;
      padding: 8px 16px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.8rem;
      margin-top: 5px;
    }

    @media (max-width: 550px) {
      .title { font-size: 1.4rem; margin-top: 15px; }
      .desc { font-size: 0.85rem; }
      .status-badge { font-size: 0.8rem; }
      .mela-type-text { font-size: 0.8rem; }
      .separator { font-size: 0.8rem; }
      .slide { padding: 15px; }
      .blinking-dot, .static-dot { width: 10px; height: 10px; }
      .status-type-wrapper {
        gap: 8px;
        padding: 1px 15px;
        margin-top: 1px;
        margin-bottom: 3px;
      }
    }

    @media (max-width: 400px) {
      .title { font-size: 1.2rem; margin-top: 10px; }
      .desc { font-size: 0.75rem; }
      .status-badge { font-size: 0.7rem; }
      .mela-type-text { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
<div class="billboard">
  <div class="screen">
    <div class="content-container" id="slidesContainer">
      <div class="slide active">
        <div class="news-card">
          <div style="text-align:center; padding:40px;">🎪 লোড হচ্ছে...</div>
        </div>
      </div>
    </div>
    <div class="slide-indicators" id="indicators"></div>
  </div>
</div>

<!-- মোডাল -->
<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAKRgsUrYL4uAWinn5dcJrKck1nqUokRdw",
    authDomain: "all-hadith-a68fa.firebaseapp.com",
    projectId: "all-hadith-a68fa",
    databaseURL: "https://all-hadith-a68fa-default-rtdb.firebaseio.com/",
    storageBucket: "all-hadith-a68fa.firebasestorage.app",
    messagingSenderId: "124928027736",
    appId: "1:124928027736:android:f4d9a9a9ed667150ca2e2d"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let slides = [];
  let currentIndex = 0;
  let interval;

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function getStatus(startDate, endDate) {
    if (!startDate || !endDate) return 'upcoming';
    const now = new Date();
    const start = new Date(startDate);
    const end = new Date(endDate);
    if (now >= start && now <= end) return 'running';
    return 'upcoming';
  }

  function formatDateTime(dateStr) {
    if (!dateStr) return 'N/A';
    const d = new Date(dateStr);
    return d.toLocaleString('bn-BD');
  }

  // মোডাল দেখানো
  window.showModalById = function(id, event) {
    if (event) event.stopPropagation();
    console.log("showModalById called with id:", id);
    const card = slides.find(s => s.id === id);
    if (!card) {
      console.error("Card not found for id:", id);
      return;
    }
    
    const modal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');
    const status = getStatus(card.startDate, card.endDate);
    const statusText = status === 'running' ? 'চলমান' : 'আসন্ন';
    const statusIcon = status === 'running' ? '🟢' : '🟠';
    
    let contactsHtml = '';
    if (card.contacts && card.contacts.length > 0) {
      card.contacts.forEach(c => {
        contactsHtml += `<div class="contact-item">👤 ${escapeHtml(c.name)}: <a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a></div>`;
      });
    } else {
      contactsHtml = '<div>কোনো যোগাযোগ তথ্য নেই</div>';
    }

    const mapHtml = card.mapLink ? `<div><a href="${escapeHtml(card.mapLink)}" target="_blank" class="map-link-btn">🗺️ গুগল ম্যাপে দেখুন</a></div>` : '';

    modalBody.innerHTML = `
      <div class="modal-title">${escapeHtml(card.title)}</div>
      
      <div class="modal-section">
        <div><strong>📅 মেলার ধরন:</strong> ${escapeHtml(card.melaType)} (${card.days || ''} দিনব্যাপী)</div>
        <div style="margin-top:5px;"><strong>স্ট্যাটাস:</strong> ${statusIcon} ${statusText}</div>
      </div>

      <div class="modal-section">
        <div><strong>📝 বিস্তারিত বিবরণ:</strong></div>
        <div style="margin-top:5px; line-height:1.5;">${escapeHtml(card.description)}</div>
      </div>

      <div class="modal-section">
        <div><strong>📍 ঠিকানা/লোকেশন:</strong></div>
        <div>${escapeHtml(card.address || 'ঠিকানা দেওয়া নেই')}</div>
      </div>

      <div class="modal-section">
        <div><strong>📞 যোগাযোগ করুন:</strong></div>
        ${contactsHtml}
      </div>

      <div class="modal-section">
        <div><strong>🗓️ সময়কাল:</strong></div>
        <div>শুরু: ${formatDateTime(card.startDate)}</div>
        <div>শেষ: ${formatDateTime(card.endDate)}</div>
      </div>

      ${mapHtml ? `<div class="modal-section">${mapHtml}</div>` : ''}
    `;
    modal.style.display = 'flex';
  };

  // স্লাইড তৈরি
  function createSlideHTML(card, idx) {
    const status = getStatus(card.startDate, card.endDate);
    const isRunning = status === 'running';
    const statusText = isRunning ? 'চলমান' : 'আসন্ন';
    
    const dotHtml = isRunning 
      ? '<span class="blinking-dot"></span>'
      : '<span class="static-dot"></span>';
    
    return `
      <div class="slide" data-id="${card.id}" data-index="${idx}">
        <div class="news-card" onclick="showModalById('${card.id}', event)">
          <div class="title">${escapeHtml(card.title)}</div>
          <div class="status-type-wrapper">
            <div class="status-badge ${isRunning ? 'running' : 'upcoming'}">
              ${dotHtml}
              ${statusText}
            </div>
            <span class="separator">|</span>
            <span class="mela-type-text">${escapeHtml(card.melaType)} (${card.days || ''} দিন)</span>
          </div>
          <div class="desc">${escapeHtml(card.description).substring(0, 120)}${card.description.length > 120 ? '...' : ''}</div>
          <div class="view-text" onclick="showModalById('${card.id}', event)">View</div>
        </div>
      </div>
    `;
  }

  function renderSlides() {
    const container = document.getElementById('slidesContainer');
    const indicatorsDiv = document.getElementById('indicators');
    
    if (!slides || slides.length === 0) {
      container.innerHTML = `<div class="slide active"><div class="news-card"><div style="text-align:center; padding:40px;">🎪 কোনো মেলার তথ্য নেই<br>অ্যাডমিন প্যানেল থেকে যোগ করুন</div></div></div>`;
      indicatorsDiv.innerHTML = '<div class="indicator active"></div>';
      return;
    }

    let slidesHtml = '';
    slides.forEach((slide, idx) => {
      slidesHtml += createSlideHTML(slide, idx);
    });
    container.innerHTML = slidesHtml;

    let indicatorsHtml = '';
    for (let i = 0; i < slides.length; i++) {
      indicatorsHtml += `<div class="indicator ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`;
    }
    indicatorsDiv.innerHTML = indicatorsHtml;

    document.querySelectorAll('.indicator').forEach(ind => {
      ind.addEventListener('click', (e) => {
        const index = parseInt(e.target.getAttribute('data-index'));
        if (!isNaN(index)) goToSlide(index);
      });
    });

    currentIndex = 0;
    showSlide(0);
    startSlideshow();
  }

  function showSlide(index) {
    const allSlides = document.querySelectorAll('.slide');
    const indicators = document.querySelectorAll('.indicator');
    allSlides.forEach(s => s.classList.remove('active'));
    indicators.forEach(i => i.classList.remove('active'));
    if (allSlides[index]) allSlides[index].classList.add('active');
    if (indicators[index]) indicators[index].classList.add('active');
  }

  function goToSlide(index) {
    if (slides.length === 0) return;
    currentIndex = index;
    showSlide(currentIndex);
    startSlideshow();
  }

  function nextSlide() {
    if (slides.length === 0) return;
    currentIndex = (currentIndex + 1) % slides.length;
    showSlide(currentIndex);
  }

  function startSlideshow() {
    if (interval) clearInterval(interval);
    if (slides.length > 1) interval = setInterval(nextSlide, 5000);
  }

  // Firebase Realtime Database লোড
  const melaPostsRef = database.ref('melaPosts');
  melaPostsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      slides = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      slides.sort((a, b) => (a.order || 0) - (b.order || 0));
      console.log("Slides loaded:", slides.length);
    } else {
      slides = [];
      console.log("No data found");
    }
    renderSlides();
  });

  // মোডাল ক্লোজ
  document.querySelector('.close-modal').onclick = () => {
    document.getElementById('detailModal').style.display = 'none';
  };
  window.onclick = (e) => {
    if (e.target === document.getElementById('detailModal')) {
      document.getElementById('detailModal').style.display = 'none';
    }
  };
</script>
</body>
</html>
