<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>বাংলাদেশ মেলা অ্যাপস | গোল্ডেন স্লাইডার</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #e8e8e8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', 'Noto Sans Bengali', system-ui, sans-serif;
      padding: 16px;
    }

    .billboard {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15), 0 0 0 2px rgba(212, 175, 55, 0.3);
      position: relative;
      border-radius: 24px;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      touch-action: pan-y pinch-zoom;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      overflow-y: auto;
      padding: 20px;
    }

    .slide.active {
      opacity: 1;
      z-index: 10;
    }

    /* পুরো কার্ড ক্লিকযোগ্য */
    .news-card {
      background: #ffffff;
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border-radius: 20px;
      position: relative;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .news-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
    }

    /* স্ট্যাটাস ও টাইপ */
    .status-type-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: transparent;
      padding: 2px 20px;
      border-radius: 50px;
      margin-top: 2px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .status-badge.running {
      color: #4caf50;
    }

    .status-badge.upcoming {
      color: #ff9800;
    }

    .blinking-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4caf50;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .static-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ff9800;
    }

    .separator {
      color: #b8860b;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .mela-type-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: #b8860b;
      background: transparent;
    }

    /* মেলার নাম */
    .title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #b8860b, #d4af37, #ffd700);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-top: 20px;
      margin-bottom: 10px;
      line-height: 1.3;
      text-align: center;
      padding: 0 15px;
    }

    /* বিবরণ */
    .desc {
      font-size: 1.1rem;
      color: #6b6b6b;
      line-height: 1.6;
      margin-bottom: 15px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-align: center;
      padding: 0 15px;
    }

    .slide-indicators {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .indicator.active {
      width: 24px;
      border-radius: 10px;
      background: #d4af37;
    }

    /* মোডাল */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 500px;
      max-height: 80%;
      border-radius: 28px;
      padding: 24px 22px;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }

    .close-modal {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 26px;
      cursor: pointer;
      color: #b8860b;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #b8860b, #d4af37);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 20px;
      text-align: center;
    }

    .modal-section {
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .contact-item {
      padding: 6px 0;
      font-size: 0.9rem;
    }

    .contact-item a {
      color: #b8860b;
      text-decoration: none;
    }

    .map-link-btn {
      display: inline-block;
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      color: white;
      padding: 8px 18px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    @media (max-width: 550px) {
      .title { font-size: 1.5rem; margin-top: 12px; }
      .desc { font-size: 0.95rem; }
      .status-badge { font-size: 0.95rem; }
      .mela-type-text { font-size: 0.95rem; }
      .separator { font-size: 0.95rem; }
      .slide { padding: 16px; }
      .blinking-dot, .static-dot { width: 13px; height: 13px; }
      .status-type-wrapper { gap: 10px; }
    }
  </style>
</head>
<body>
<div class="billboard">
  <div class="screen">
    <div class="content-container" id="slidesContainer">
      <div class="slide active">
        <div class="news-card">
          <div style="text-align:center; padding:40px;">🎪 লোড হচ্ছে...</div>
        </div>
      </div>
    </div>
    <div class="slide-indicators" id="indicators"></div>
  </div>
</div>

<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAKRgsUrYL4uAWinn5dcJrKck1nqUokRdw",
    authDomain: "all-hadith-a68fa.firebaseapp.com",
    projectId: "all-hadith-a68fa",
    databaseURL: "https://all-hadith-a68fa-default-rtdb.firebaseio.com/",
    storageBucket: "all-hadith-a68fa.firebasestorage.app",
    messagingSenderId: "124928027736",
    appId: "1:124928027736:android:f4d9a9a9ed667150ca2e2d"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let slides = [];
  let currentIndex = 0;
  let interval;
  let touchStartX = 0;
  let touchEndX = 0;

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function getStatus(startDate, endDate) {
    if (!startDate || !endDate) return 'upcoming';
    const now = new Date();
    const start = new Date(startDate);
    const end = new Date(endDate);
    if (now >= start && now <= end) return 'running';
    return 'upcoming';
  }

  function formatDateTime(dateStr) {
    if (!dateStr) return 'N/A';
    const d = new Date(dateStr);
    return d.toLocaleString('bn-BD');
  }

  window.showModalById = function(id, event) {
    if (event) event.stopPropagation();
    const card = slides.find(s => s.id === id);
    if (!card) return;
    
    const modal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');
    const status = getStatus(card.startDate, card.endDate);
    const statusText = status === 'running' ? 'চলমান' : 'আসন্ন';
    const statusIcon = status === 'running' ? '🟢' : '🟠';
    
    let contactsHtml = '';
    if (card.contacts && card.contacts.length > 0) {
      card.contacts.forEach(c => {
        contactsHtml += `<div class="contact-item">👤 ${escapeHtml(c.name)}: <a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a></div>`;
      });
    } else {
      contactsHtml = '<div>কোনো যোগাযোগ তথ্য নেই</div>';
    }

    const mapHtml = card.mapLink ? `<div><a href="${escapeHtml(card.mapLink)}" target="_blank" class="map-link-btn">🗺️ গুগল ম্যাপে দেখুন</a></div>` : '';

    modalBody.innerHTML = `
      <div class="modal-title">${escapeHtml(card.title)}</div>
      <div class="modal-section">
        <strong>📅 মেলার ধরন</strong>
        <div>${escapeHtml(card.melaType)} (${card.days || ''} দিনব্যাপী)</div>
        <div style="margin-top:6px;"><strong>স্ট্যাটাস:</strong> ${statusIcon} ${statusText}</div>
      </div>
      <div class="modal-section">
        <strong>📝 বিস্তারিত বিবরণ</strong>
        <div style="line-height:1.5;">${escapeHtml(card.description)}</div>
      </div>
      <div class="modal-section">
        <strong>📍 ঠিকানা/লোকেশন</strong>
        <div>${escapeHtml(card.address || 'ঠিকানা দেওয়া নেই')}</div>
      </div>
      <div class="modal-section">
        <strong>📞 যোগাযোগ করুন</strong>
        ${contactsHtml}
      </div>
      <div class="modal-section">
        <strong>🗓️ সময়কাল</strong>
        <div>শুরু: ${formatDateTime(card.startDate)}</div>
        <div>শেষ: ${formatDateTime(card.endDate)}</div>
      </div>
      ${mapHtml ? `<div class="modal-section">${mapHtml}</div>` : ''}
    `;
    modal.style.display = 'flex';
  };

  function createSlideHTML(card, idx) {
    const status = getStatus(card.startDate, card.endDate);
    const isRunning = status === 'running';
    const statusText = isRunning ? 'চলমান' : 'আসন্ন';
    const dotHtml = isRunning ? '<span class="blinking-dot"></span>' : '<span class="static-dot"></span>';
    
    return `
      <div class="slide" data-id="${card.id}" data-index="${idx}">
        <div class="news-card" onclick="showModalById('${card.id}', event)">
          <div class="title">${escapeHtml(card.title)}</div>
          <div class="status-type-wrapper">
            <div class="status-badge ${isRunning ? 'running' : 'upcoming'}">
              ${dotHtml} ${statusText}
            </div>
            <span class="separator">|</span>
            <span class="mela-type-text">${escapeHtml(card.melaType)} (${card.days || ''} দিন)</span>
          </div>
          <div class="desc">${escapeHtml(card.description).substring(0, 120)}${card.description.length > 120 ? '...' : ''}</div>
        </div>
      </div>
    `;
  }

  function handleTouchStart(e) { touchStartX = e.changedTouches[0].screenX; }
  function handleTouchEnd(e) {
    touchEndX = e.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      else currentIndex = (currentIndex + 1) % slides.length;
      showSlide(currentIndex);
      startSlideshow();
    }
  }

  function renderSlides() {
    const container = document.getElementById('slidesContainer');
    const indicatorsDiv = document.getElementById('indicators');
    
    if (!slides.length) {
      container.innerHTML = `<div class="slide active"><div class="news-card"><div style="padding:40px;">🎪 কোনো মেলার তথ্য নেই</div></div></div>`;
      indicatorsDiv.innerHTML = '<div class="indicator active"></div>';
      return;
    }

    container.innerHTML = slides.map((s,i) => createSlideHTML(s,i)).join('');
    indicatorsDiv.innerHTML = slides.map((_,i) => `<div class="indicator ${i===0?'active':''}" data-index="${i}"></div>`).join('');

    document.querySelectorAll('.indicator').forEach(ind => {
      ind.addEventListener('click', (e) => {
        const idx = parseInt(e.target.dataset.index);
        if (!isNaN(idx)) goToSlide(idx);
      });
    });

    document.querySelector('.content-container').addEventListener('touchstart', handleTouchStart);
    document.querySelector('.content-container').addEventListener('touchend', handleTouchEnd);

    currentIndex = 0;
    showSlide(0);
    startSlideshow();
  }

  function showSlide(index) {
    document.querySelectorAll('.slide').forEach((s,i) => s.classList.toggle('active', i===index));
    document.querySelectorAll('.indicator').forEach((d,i) => d.classList.toggle('active', i===index));
  }

  function goToSlide(index) {
    if (!slides.length) return;
    currentIndex = index;
    showSlide(currentIndex);
    startSlideshow();
  }

  function startSlideshow() {
    if (interval) clearInterval(interval);
    if (slides.length > 1) interval = setInterval(() => {
      currentIndex = (currentIndex + 1) % slides.length;
      showSlide(currentIndex);
    }, 5000);
  }

  database.ref('melaPosts').on('value', (snap) => {
    const data = snap.val();
    slides = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).sort((a,b)=> (a.order||0)-(b.order||0)) : [];
    renderSlides();
  });

  document.querySelector('.close-modal').onclick = () => document.getElementById('detailModal').style.display = 'none';
  window.onclick = (e) => { if (e.target === document.getElementById('detailModal')) document.getElementById('detailModal').style.display = 'none'; };
</script>
</body>
</html>
