<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>বাংলাদেশ মেলা অ্যাপস | প্রিমিয়াম স্লাইডার</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0a0a2a 0%, #1a1a3a 50%, #0f0f2a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', 'Segoe UI', 'Noto Sans Bengali', system-ui, sans-serif;
      padding: 20px;
      position: relative;
    }

    /* ডেকোরেটিভ ব্লার এলিমেন্ট */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .billboard {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative;
      z-index: 1;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(248,245,240,0.95) 100%);
      backdrop-filter: blur(4px);
      border-radius: 38px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02), 0 4px 20px rgba(0,0,0,0.05);
    }

    .content-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      touch-action: pan-y pinch-zoom;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      padding: 28px 24px;
      scrollbar-width: thin;
    }

    .slide.active {
      opacity: 1;
      z-index: 10;
    }

    /* কার্ড ডিজাইন - প্রিমিয়াম */
    .news-card {
      width: 100%;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 24px 20px 32px;
      transition: all 0.3s ease;
      border: 1px solid rgba(212, 175, 55, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }

    .news-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      background: rgba(255,255,255,0.7);
    }

    /* স্ট্যাটাস ও টাইপ */
    .status-type-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 100px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      border: 0.5px solid rgba(212, 175, 55, 0.2);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .status-badge.running {
      color: #10b981;
    }

    .status-badge.upcoming {
      color: #f59e0b;
    }

    .blinking-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      animation: blink 1.2s infinite;
      box-shadow: 0 0 6px #10b981;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .static-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 4px #f59e0b;
    }

    .separator {
      color: #d4af37;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0.6;
    }

    .mela-type-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #b8860b;
      background: transparent;
      letter-spacing: 0.2px;
    }

    /* মেলার নাম */
    .title {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #8B6914 0%, #D4AF37 40%, #FFD700 80%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 16px;
      line-height: 1.3;
      text-align: center;
      letter-spacing: -0.3px;
    }

    /* বিবরণ */
    .desc {
      font-size: 0.95rem;
      color: #4a4a5a;
      line-height: 1.6;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-align: center;
      font-weight: 450;
    }

    /* প্রিমিয়াম ডটস */
    .slide-indicators {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }

    .indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      backdrop-filter: blur(2px);
    }

    .indicator.active {
      width: 24px;
      border-radius: 10px;
      background: linear-gradient(90deg, #d4af37, #ffd700);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    /* মোডাল - প্রিমিয়াম */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 30, 0.85);
      backdrop-filter: blur(16px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.97);
      width: 100%;
      max-width: 520px;
      max-height: 85%;
      border-radius: 48px;
      padding: 28px 24px;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.5);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 24px;
      font-size: 28px;
      cursor: pointer;
      color: #b8860b;
      transition: all 0.2s;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0,0,0,0.03);
    }

    .close-modal:hover {
      background: rgba(212, 175, 55, 0.1);
      transform: scale(1.05);
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #b8860b, #d4af37);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 20px;
      text-align: center;
      padding-right: 30px;
    }

    .modal-section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .modal-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .modal-section strong {
      color: #b8860b;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    .contact-item {
      padding: 8px 0;
      font-size: 0.9rem;
      border-bottom: 1px dashed rgba(0,0,0,0.05);
    }

    .contact-item a {
      color: #d4af37;
      text-decoration: none;
      font-weight: 500;
    }

    .map-link-btn {
      display: inline-block;
      background: linear-gradient(115deg, #d4af37, #c49b2a);
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .map-link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.4);
    }

    /* কাস্টম স্ক্রলবার */
    .slide::-webkit-scrollbar,
    .modal-content::-webkit-scrollbar {
      width: 4px;
    }

    .slide::-webkit-scrollbar-track,
    .modal-content::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
      border-radius: 10px;
    }

    .slide::-webkit-scrollbar-thumb,
    .modal-content::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 10px;
    }

    /* রেস্পন্সিভ */
    @media (max-width: 550px) {
      .billboard {
        padding: 8px;
        border-radius: 36px;
      }
      .screen {
        border-radius: 30px;
      }
      .slide {
        padding: 18px 16px;
      }
      .title {
        font-size: 1.4rem;
      }
      .desc {
        font-size: 0.85rem;
      }
      .news-card {
        padding: 20px 16px 28px;
      }
      .status-badge, .mela-type-text, .separator {
        font-size: 0.75rem;
      }
      .status-type-wrapper {
        gap: 8px;
        padding: 4px 14px;
      }
      .modal-content {
        padding: 22px 18px;
        border-radius: 36px;
      }
      .modal-title {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 400px) {
      .title {
        font-size: 1.2rem;
      }
      .desc {
        font-size: 0.8rem;
      }
      .status-badge, .mela-type-text {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
<div class="billboard">
  <div class="screen">
    <div class="content-container" id="slidesContainer">
      <div class="slide active">
        <div class="news-card">
          <div style="text-align:center; padding:40px; color:#b8860b;">🎪 লোড হচ্ছে...</div>
        </div>
      </div>
    </div>
    <div class="slide-indicators" id="indicators"></div>
  </div>
</div>

<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAKRgsUrYL4uAWinn5dcJrKck1nqUokRdw",
    authDomain: "all-hadith-a68fa.firebaseapp.com",
    projectId: "all-hadith-a68fa",
    databaseURL: "https://all-hadith-a68fa-default-rtdb.firebaseio.com/",
    storageBucket: "all-hadith-a68fa.firebasestorage.app",
    messagingSenderId: "124928027736",
    appId: "1:124928027736:android:f4d9a9a9ed667150ca2e2d"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let slides = [];
  let currentIndex = 0;
  let interval;
  let touchStartX = 0;
  let touchEndX = 0;

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function getStatus(startDate, endDate) {
    if (!startDate || !endDate) return 'upcoming';
    const now = new Date();
    const start = new Date(startDate);
    const end = new Date(endDate);
    if (now >= start && now <= end) return 'running';
    return 'upcoming';
  }

  function formatDateTime(dateStr) {
    if (!dateStr) return 'N/A';
    const d = new Date(dateStr);
    return d.toLocaleString('bn-BD');
  }

  window.showModalById = function(id, event) {
    if (event) event.stopPropagation();
    const card = slides.find(s => s.id === id);
    if (!card) return;
    
    const modal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');
    const status = getStatus(card.startDate, card.endDate);
    const statusText = status === 'running' ? 'চলমান' : 'আসন্ন';
    const statusIcon = status === 'running' ? '🟢' : '🟠';
    
    let contactsHtml = '';
    if (card.contacts && card.contacts.length > 0) {
      card.contacts.forEach(c => {
        contactsHtml += `<div class="contact-item">👤 ${escapeHtml(c.name)}: <a href="tel:${escapeHtml(c.phone)}">${escapeHtml(c.phone)}</a></div>`;
      });
    } else {
      contactsHtml = '<div>কোনো যোগাযোগ তথ্য নেই</div>';
    }

    const mapHtml = card.mapLink ? `<div><a href="${escapeHtml(card.mapLink)}" target="_blank" class="map-link-btn">🗺️ গুগল ম্যাপে দেখুন</a></div>` : '';

    modalBody.innerHTML = `
      <div class="modal-title">${escapeHtml(card.title)}</div>
      
      <div class="modal-section">
        <strong>📅 মেলার ধরন</strong>
        <div>${escapeHtml(card.melaType)} (${card.days || ''} দিনব্যাপী)</div>
        <div style="margin-top:8px;"><strong>স্ট্যাটাস:</strong> ${statusIcon} ${statusText}</div>
      </div>

      <div class="modal-section">
        <strong>📝 বিস্তারিত বিবরণ</strong>
        <div style="line-height:1.6;">${escapeHtml(card.description)}</div>
      </div>

      <div class="modal-section">
        <strong>📍 ঠিকানা/লোকেশন</strong>
        <div>${escapeHtml(card.address || 'ঠিকানা দেওয়া নেই')}</div>
      </div>

      <div class="modal-section">
        <strong>📞 যোগাযোগ করুন</strong>
        ${contactsHtml}
      </div>

      <div class="modal-section">
        <strong>🗓️ সময়কাল</strong>
        <div>শুরু: ${formatDateTime(card.startDate)}</div>
        <div>শেষ: ${formatDateTime(card.endDate)}</div>
      </div>

      ${mapHtml ? `<div class="modal-section">${mapHtml}</div>` : ''}
    `;
    modal.style.display = 'flex';
  };

  function createSlideHTML(card, idx) {
    const status = getStatus(card.startDate, card.endDate);
    const isRunning = status === 'running';
    const statusText = isRunning ? 'চলমান' : 'আসন্ন';
    
    const dotHtml = isRunning 
      ? '<span class="blinking-dot"></span>'
      : '<span class="static-dot"></span>';
    
    return `
      <div class="slide" data-id="${card.id}" data-index="${idx}">
        <div class="news-card" onclick="showModalById('${card.id}', event)">
          <div class="title">${escapeHtml(card.title)}</div>
          <div class="status-type-wrapper">
            <div class="status-badge ${isRunning ? 'running' : 'upcoming'}">
              ${dotHtml}
              ${statusText}
            </div>
            <span class="separator">|</span>
            <span class="mela-type-text">${escapeHtml(card.melaType)} (${card.days || ''} দিন)</span>
          </div>
          <div class="desc">${escapeHtml(card.description).substring(0, 120)}${card.description.length > 120 ? '...' : ''}</div>
        </div>
      </div>
    `;
  }

  function handleTouchStart(event) {
    touchStartX = event.changedTouches[0].screenX;
  }

  function handleTouchEnd(event) {
    touchEndX = event.changedTouches[0].screenX;
    const swipeDistance = touchEndX - touchStartX;
    const minSwipeDistance = 50;
    
    if (Math.abs(swipeDistance) > minSwipeDistance) {
      if (swipeDistance > 0) {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      } else {
        currentIndex = (currentIndex + 1) % slides.length;
      }
      showSlide(currentIndex);
      startSlideshow();
    }
  }

  function renderSlides() {
    const container = document.getElementById('slidesContainer');
    const indicatorsDiv = document.getElementById('indicators');
    
    if (!slides || slides.length === 0) {
      container.innerHTML = `<div class="slide active"><div class="news-card"><div style="text-align:center; padding:40px;">🎪 কোনো মেলার তথ্য নেই<br>অ্যাডমিন প্যানেল থেকে যোগ করুন</div></div></div>`;
      indicatorsDiv.innerHTML = '<div class="indicator active"></div>';
      return;
    }

    let slidesHtml = '';
    slides.forEach((slide, idx) => {
      slidesHtml += createSlideHTML(slide, idx);
    });
    container.innerHTML = slidesHtml;

    let indicatorsHtml = '';
    for (let i = 0; i < slides.length; i++) {
      indicatorsHtml += `<div class="indicator ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`;
    }
    indicatorsDiv.innerHTML = indicatorsHtml;

    document.querySelectorAll('.indicator').forEach(ind => {
      ind.addEventListener('click', (e) => {
        const index = parseInt(e.target.getAttribute('data-index'));
        if (!isNaN(index)) goToSlide(index);
      });
    });

    const sliderContainer = document.querySelector('.content-container');
    sliderContainer.addEventListener('touchstart', handleTouchStart, false);
    sliderContainer.addEventListener('touchend', handleTouchEnd, false);

    currentIndex = 0;
    showSlide(0);
    startSlideshow();
  }

  function showSlide(index) {
    const allSlides = document.querySelectorAll('.slide');
    const indicators = document.querySelectorAll('.indicator');
    allSlides.forEach(s => s.classList.remove('active'));
    indicators.forEach(i => i.classList.remove('active'));
    if (allSlides[index]) allSlides[index].classList.add('active');
    if (indicators[index]) indicators[index].classList.add('active');
  }

  function goToSlide(index) {
    if (slides.length === 0) return;
    currentIndex = index;
    showSlide(currentIndex);
    startSlideshow();
  }

  function startSlideshow() {
    if (interval) clearInterval(interval);
    if (slides.length > 1) interval = setInterval(() => {
      currentIndex = (currentIndex + 1) % slides.length;
      showSlide(currentIndex);
    }, 5000);
  }

  const melaPostsRef = database.ref('melaPosts');
  melaPostsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      slides = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      slides.sort((a, b) => (a.order || 0) - (b.order || 0));
    } else {
      slides = [];
    }
    renderSlides();
  });

  document.querySelector('.close-modal').onclick = () => {
    document.getElementById('detailModal').style.display = 'none';
  };
  window.onclick = (e) => {
    if (e.target === document.getElementById('detailModal')) {
      document.getElementById('detailModal').style.display = 'none';
    }
  };
</script>
</body>
</html>
